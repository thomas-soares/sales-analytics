name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: pytest

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/htmlcov
          if-no-files-found: ignore

      - name: Upload backend coverage data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-data
          path: backend/coverage.json
          if-no-files-found: error

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm exec vitest run --coverage

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Upload frontend coverage data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-data
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: error

  coverage-badges:
    name: Publish coverage badges
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend coverage data
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-data
          path: coverage-artifacts/backend

      - name: Download frontend coverage data
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-data
          path: coverage-artifacts/frontend

      - name: Generate badge data
        run: >
          python scripts/write_coverage_badges.py
          --backend coverage-artifacts/backend/coverage.json
          --frontend coverage-artifacts/frontend/coverage-summary.json
          --out badges

      - name: Publish badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          if git rev-parse --verify origin/badges; then
            git switch --track -c badges origin/badges
          else
            git switch --orphan badges
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name badges -exec rm -rf {} +
          cp badges/*.json .
          rm -rf badges
          git add backend-coverage.json frontend-coverage.json
          git commit -m "chore: update coverage badges" || exit 0
          git push origin badges
