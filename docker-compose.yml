services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales-analytics-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales-analytics-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    environment:
      - CI=true
    command: sh -c "pnpm install --no-frozen-lockfile && pnpm dev"
